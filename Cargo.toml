[package]
name = "seqhash"
version = "0.1.0"
edition = "2021"
description = "Fast mismatch-tolerant sequence lookup with disambiguation"
repository = "https://github.com/noamteyssier/seqhash"
license = "MIT"
keywords = ["bioinformatics", "sequencing", "DNA", "hashing", "mismatch"]
categories = ["science", "algorithms"]

[dependencies]
hashbrown = "0.16"
fxhash = "0.2"

[dev-dependencies]
criterion = "0.8"
rand = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
ahash = "0.8"
wyhash = "0.6"

[[bench]]
name = "seqhash_bench"
harness = false
